  <!-- ZettaLite logo: the CRT mark and the "ZettaLite" wordmark.
       The word is Karla Regular converted to a path and made heavier with a stroke.
       A dark outline sits under the light letters, so the logo reads on white and on dark backgrounds. -->
  <defs>
    <linearGradient id="bezel" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3a3a3a"/>
      <stop offset="1" stop-color="#161616"/>
    </linearGradient>
    <radialGradient id="glow" cx="60" cy="54" r="56" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#2a2a2a"/>
      <stop offset="1" stop-color="#000000"/>
    </radialGradient>
    <linearGradient id="stream" x1="0" y1="0" x2="48" y2="44" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="0.5" stop-color="#e0e0e0"/>
      <stop offset="1" stop-color="#9a9a9a"/>
    </linearGradient>
    <pattern id="scan" width="4" height="4" patternUnits="userSpaceOnUse">
      <rect width="4" height="1.4" fill="#000000" fill-opacity="0.25"/>
    </pattern>
    <filter id="blur" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="3"/>
    </filter>
    <clipPath id="screen">
      <rect x="8" y="8" width="104" height="104" rx="20"/>
    </clipPath>
    <linearGradient id="word" x1="0" y1="-70" x2="0" y2="0" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#b8b8b8"/>
    </linearGradient>
  </defs>
  <g transform="scale(2)">
