<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <!-- ZettaLite app icon. The Z of ZettaStream on a CRT screen, full bleed.
       The scan lines have a period of 18 units, so they stay visible at 57 pixels.
       icon-ios6.svg adds the round corners and the gloss. -->
  <defs>
    <linearGradient id="ibezel" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3a3a3a"/>
      <stop offset="1" stop-color="#161616"/>
    </linearGradient>
    <radialGradient id="iglow" cx="256" cy="230" r="240" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#2a2a2a"/>
      <stop offset="1" stop-color="#000000"/>
    </radialGradient>
    <linearGradient id="istream" x1="0" y1="0" x2="48" y2="44" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="0.5" stop-color="#e0e0e0"/>
      <stop offset="1" stop-color="#9a9a9a"/>
    </linearGradient>
    <pattern id="iscan" width="18" height="18" patternUnits="userSpaceOnUse">
      <rect width="18" height="6" fill="#000000" fill-opacity="0.25"/>
    </pattern>
    <filter id="iblur" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="13"/>
    </filter>
    <clipPath id="iscreen">
      <rect x="30" y="30" width="452" height="452" rx="72"/>
    </clipPath>
  </defs>
  <rect width="512" height="512" fill="url(#ibezel)"/>
  <g clip-path="url(#iscreen)">
    <rect x="30" y="30" width="452" height="452" fill="url(#iglow)"/>
    <path d="M0 0H48V12L20 32H48V44H0V32L28 12H0Z" fill="#ffffff" fill-opacity="0.55" filter="url(#iblur)" transform="translate(102 118) scale(6.4)"/>
    <path d="M0 0H48V12L20 32H48V44H0V32L28 12H0Z" fill="#000000" fill-opacity="0.35" transform="translate(102 126) scale(6.4)"/>
    <path d="M0 0H48V12L20 32H48V44H0V32L28 12H0Z" fill="url(#istream)" transform="translate(102 118) scale(6.4)"/>
    <rect x="30" y="30" width="452" height="452" fill="url(#iscan)"/>
    <path d="M44 30 H468 Q482 30 482 44 V112 Q256 176 30 112 V44 Q30 30 44 30 Z" fill="#ffffff" fill-opacity="0.09"/>
  </g>
  <rect x="30" y="30" width="452" height="452" rx="72" fill="none" stroke="#000000" stroke-opacity="0.6" stroke-width="3"/>
  <circle cx="446" cy="450" r="9" fill="#f2a33a"/>
</svg>
