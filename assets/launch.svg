<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 480" width="320" height="480">
  <!-- The launch image: a black screen with the mark in the middle.
       The status bar is on top of the first 20 pixels. -->
  <defs>
    <linearGradient id="bezel" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3a3a3a"/>
      <stop offset="1" stop-color="#161616"/>
    </linearGradient>
    <radialGradient id="glow" cx="60" cy="54" r="56" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#2a2a2a"/>
      <stop offset="1" stop-color="#000000"/>
    </radialGradient>
    <linearGradient id="stream" x1="0" y1="0" x2="48" y2="44" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="0.5" stop-color="#e0e0e0"/>
      <stop offset="1" stop-color="#9a9a9a"/>
    </linearGradient>
    <pattern id="scan" width="4" height="4" patternUnits="userSpaceOnUse">
      <rect width="4" height="1.4" fill="#000000" fill-opacity="0.25"/>
    </pattern>
    <filter id="blur" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="3"/>
    </filter>
    <clipPath id="screen">
      <rect x="8" y="8" width="104" height="104" rx="20"/>
    </clipPath>
  </defs>
  <rect width="320" height="480" fill="#000000"/>
  <g transform="translate(100 180)">
    <rect width="120" height="120" rx="26" fill="url(#bezel)"/>
    <rect x="0.75" y="0.75" width="118.5" height="118.5" rx="25.5" fill="none" stroke="#5a5a5a" stroke-width="1.5"/>
    <g clip-path="url(#screen)">
      <rect x="8" y="8" width="104" height="104" fill="url(#glow)"/>
      <path d="M0 0H48V12L20 32H48V44H0V32L28 12H0Z" fill="#ffffff" fill-opacity="0.55" filter="url(#blur)" transform="translate(24 27) scale(1.5)"/>
      <path d="M0 0H48V12L20 32H48V44H0V32L28 12H0Z" fill="#000000" fill-opacity="0.35" transform="translate(24 29) scale(1.5)"/>
      <path d="M0 0H48V12L20 32H48V44H0V32L28 12H0Z" fill="url(#stream)" transform="translate(24 27) scale(1.5)"/>
      <rect x="8" y="8" width="104" height="104" fill="url(#scan)"/>
      <path d="M12 8 H108 Q112 8 112 12 V28 Q60 44 8 28 V12 Q8 8 12 8 Z" fill="#ffffff" fill-opacity="0.09"/>
    </g>
    <circle cx="103" cy="105" r="2.2" fill="#f2a33a"/>
  </g>
</svg>
